name: Deploy Reformas HZ to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Una vez por semana (lunes, 06:00 UTC) para refrescar las reseñas de Google.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          # Clave de Google Places para descargar las reseñas (Settings → Secrets → Actions).
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Custom domain (reformashz.com) serves from the root.
          # Use "/casa-craft-madrid/" only if publishing to the project URL
          # https://d1xluv.github.io/casa-craft-madrid/ instead.
          VITE_BASE_PATH: /

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
